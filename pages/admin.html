<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Live Orders — MyNeedUrban Admin</title>
  <link rel="icon" type="image/png" href="../assets/favicon/MyNeedUrban_favicon_v3.png" />
  <!-- Its own manifest, so staff install "MNU Admin" separately from the customer app -->
  <link rel="manifest" href="admin.webmanifest" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MNU Admin" />
  <link rel="apple-touch-icon" href="../assets/pwa/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- Same ?v= as index.html and every JS import — see the note in index.html -->
  <link rel="stylesheet" href="../css/admin.css?v=20260924b" />
</head>
<body class="adm">

  <header class="adm-bar">
    <img src="../assets/favicon/MyNeedUrban_favicon_v3.png" alt="" class="adm-logo" width="34" height="34" />
    <div class="adm-titles">
      <strong>Live Orders</strong>
      <span class="adm-live" id="liveState" data-state="wait"><span class="dot" aria-hidden="true"></span><span id="liveTxt">Connecting…</span></span>
    </div>
    <div class="adm-bar-actions">
      <button type="button" class="adm-ibtn" id="alertsBtn" aria-pressed="false" hidden>
        <i class="fa-solid fa-bell-slash" aria-hidden="true"></i><span>Alerts off</span>
      </button>
      <button type="button" class="adm-ibtn" id="installAppBtn" hidden>
        <i class="fa-solid fa-mobile-screen" aria-hidden="true"></i><span class="pwa-label">Install</span>
      </button>
      <button type="button" class="adm-ibtn adm-icon-only" id="menuBtn" aria-haspopup="true" aria-expanded="false" aria-controls="admMenu" aria-label="More options" hidden>
        <i class="fa-solid fa-ellipsis-vertical" aria-hidden="true"></i>
      </button>
    </div>
    <div class="adm-menu" id="admMenu" hidden>
      <p class="adm-who" id="whoami"></p>
      <button type="button" id="awakeBtn" hidden><i class="fa-solid fa-sun" aria-hidden="true"></i><span>Keep screen awake</span></button>
      <a href="../index.html" target="_blank" rel="noopener"><i class="fa-solid fa-globe" aria-hidden="true"></i><span>Open website</span></a>
      <button type="button" id="signOutBtn" class="danger"><i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i><span>Sign out</span></button>
    </div>
  </header>

  <main class="adm-main">
    <!-- Sign-in / access / loading states are rendered here by admin.js -->
    <section class="adm-gate" id="gate" aria-live="polite">
      <div class="g-card"><div class="spinner" aria-hidden="true"></div><p>Checking your session…</p></div>
    </section>

    <section id="dash" hidden>
      <div class="adm-stats" id="stats"></div>

      <div class="adm-tools">
        <div class="adm-search">
          <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
          <input id="q" type="search" autocomplete="off" enterkeyhint="search"
                 placeholder="Search order ID, name, phone, service, area…" aria-label="Search orders" />
        </div>
        <div class="adm-chips" id="statusChips" role="group" aria-label="Filter by status"></div>
        <div class="adm-chips" id="dateChips" role="group" aria-label="Filter by service date"></div>
        <div class="adm-row">
          <span class="adm-count" id="resultInfo"></span>
          <label class="adm-sort"><span>Sort</span>
            <select id="sortSel">
              <option value="new">Newest first</option>
              <option value="date">By service date</option>
            </select>
          </label>
          <button type="button" class="adm-ibtn adm-light" id="exportBtn"><i class="fa-solid fa-file-arrow-down" aria-hidden="true"></i><span>Export CSV</span></button>
        </div>
      </div>

      <div class="adm-list" id="list"></div>
      <div class="adm-more" id="moreWrap" hidden>
        <button type="button" class="a-btn a-ghost" id="moreBtn"><i class="fa-solid fa-clock-rotate-left" aria-hidden="true"></i> Load older orders</button>
      </div>
    </section>
  </main>

  <div class="adm-toast" id="admToast" role="status" aria-live="polite"></div>

  <script src="../js/pwa.js?v=20260924b" defer></script>
  <script type="module" src="../js/admin.js?v=20260924b"></script>
</body>
</html>
